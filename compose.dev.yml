# Local development only: no TLS, published on one address of this machine (OUTPOST_DEV_BIND, default 127.0.0.1).
# Set OUTPOST_DEV_BIND to the Docker bridge gateway (often 172.17.0.1) when other containers must reach it.
name: outpost-dev

services:
  outpost:
    build: .
    image: outpost:dev
    container_name: outpost_dev
    restart: unless-stopped
    environment:
      OUTPOST_ZONE: oob.test
      OUTPOST_PUBLIC_IPV4: ${OUTPOST_DEV_BIND:-127.0.0.1}
      OUTPOST_BIND_IP: 0.0.0.0
      # SHA-256 (hex) of the dev API key string, as sent in `Authorization: Bearer <key>`.
      OUTPOST_API_KEY_SHA256: ${OUTPOST_API_KEY_SHA256:?set it in .env next to this file}
      OUTPOST_RETENTION_DAYS: "90"
      OUTPOST_TLS: "off"
      OUTPOST_SMTP: "off"
      OUTPOST_DNS_PORT: "53"
      OUTPOST_HTTP_PORT: "80"
      OUTPOST_API_PORT: "9080"
      OUTPOST_DATA_DIR: /data
    ports:
      - "${OUTPOST_DEV_BIND:-127.0.0.1}:5353:53/udp"
      - "${OUTPOST_DEV_BIND:-127.0.0.1}:5353:53/tcp"
      - "${OUTPOST_DEV_BIND:-127.0.0.1}:8080:80/tcp"
      - "${OUTPOST_DEV_BIND:-127.0.0.1}:9080:9080/tcp"
    volumes:
      - outpost_data:/data

volumes:
  outpost_data:
