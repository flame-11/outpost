[project]
name = "outpost"
version = "0.1.0"
description = "A public callback catcher: authoritative name server and web listener for one zone, with sealed records and a pull API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.6",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pynacl>=1.5",
    "uvicorn>=0.30",
]

[project.scripts]
outpost = "outpost.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outpost"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
